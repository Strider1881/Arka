# Permissions + risk mapping only.
# Numeric policy (threshold, tolerance, blocked vendors, aliases) loads from
# company_world/knowledge/*.md via ark_operator.policy.kb_params.

tool_permissions:
  files: READ
  pdf_extract: READ
  knowledge_search: READ
  portal_api: READ
  ask_human: READ
  browser: IRREVERSIBLE
  desktop: IRREVERSIBLE

risk_to_decision:
  READ: ALLOW
  REVERSIBLE_WRITE: ALLOW
  IRREVERSIBLE: REQUIRE_APPROVAL
