<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Operator{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1410;
      --panel: #1a221c;
      --ink: #e8f0e9;
      --muted: #9bb0a0;
      --accent: #6fbf8a;
      --warn: #e0b35a;
      --bad: #e07a7a;
      --line: #2c3a30;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      font-family: "IBM Plex Sans", "Source Sans 3", "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 500px at 10% -10%, #1e3a2a 0%, transparent 55%),
        radial-gradient(700px 400px at 100% 0%, #243028 0%, transparent 50%),
        var(--bg);
    }
    header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    .brand { font-weight: 700; letter-spacing: 0.04em; color: var(--accent); text-decoration:none; font-size: 1.2rem; }
    main { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem; }
    h1 { font-size: 1.8rem; margin: 0 0 0.5rem; }
    p.lead { color: var(--muted); margin-top: 0; }
    textarea, input, button {
      font: inherit; border-radius: 8px; border: 1px solid var(--line);
      background: var(--panel); color: var(--ink); padding: 0.7rem 0.85rem;
    }
    textarea { width: 100%; min-height: 110px; }
    button, .btn {
      background: var(--accent); color: #0c120e; border: none; font-weight: 600;
      cursor: pointer; text-decoration: none; display: inline-block;
    }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; margin: 1rem 0; }
    .status { color: var(--muted); font-size: 0.9rem; }
    .ok { color: var(--accent); } .bad { color: var(--bad); } .warn { color: var(--warn); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.45rem 0.3rem; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
    dl.meta { display: grid; grid-template-columns: 7rem 1fr; gap: 0.25rem 0.75rem; margin: 0.75rem 0; }
    dl.meta dt { color: var(--muted); } dl.meta dd { margin: 0; }
    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; }
    .thumbs figure { margin: 0; }
    .thumbs img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: #0c120e; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">OPERATOR</a>
    <span class="status">AcmeCorp invoice demo</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
