[project]
name = "ark-operator"
version = "0.1.0"
description = "Autonomous AI employee that finishes company work and proves it"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "playwright>=1.48.0",
    "pdfplumber>=0.11.0",
    "reportlab>=4.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",
    "anthropic>=1.12.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
operator = "ark_operator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ark_operator"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.coverage.run]
branch = true
concurrency = ["thread"]
# Measured set is controlled by `make test` --cov flags (includes pipeline + browser loop).
omit = [
    "*/ark_operator/api/*",
    "*/ark_operator/cli.py",
    "*/ark_operator/demo.py",
    "*/ark_operator/llm/anthropic_client.py",
    "*/ark_operator/runtime/executor.py",
    "*/ark_operator/runtime/planner.py",
    "*/ark_operator/runtime/understand.py",
    "*/ark_operator/runtime/orchestrator.py",
    "*/ark_operator/tools/browser.py",
    "*/ark_operator/tools/portal_api.py",
    "*/ark_operator/tools/files.py",
    "*/ark_operator/tools/ask_human.py",
    "*/ark_operator/tools/knowledge_search.py",
    "*/ark_operator/tools/registry.py",
    "*/ark_operator/tools/secrets.py",
    "*/ark_operator/tools/base.py",
    "*/ark_operator/memory/knowledge.py",
    "*/ark_operator/memory/working.py",
    "*/ark_operator/logging.py",
    "*/ark_operator/config.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["ark_operator", "company_world", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM117", "SIM102"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "."
packages = ["ark_operator"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "pdfplumber.*", "reportlab.*", "playwright.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
