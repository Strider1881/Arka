<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AcmeCorp Procure{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #1a1f16;
      --muted: #5c664f;
      --accent: #2f5d50;
      --accent-2: #c45c26;
      --card: #fffdf8;
      --line: #d9d2c5;
      --ok: #2f5d50;
      --warn: #a15c00;
      --bad: #8b2e2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #e7efe8 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #f3e6d8 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    a { color: var(--accent); }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid var(--line);
      background: rgba(255,253,248,0.88);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
    }
    .brand { font-weight: 700; letter-spacing: 0.02em; font-size: 1.15rem; text-decoration: none; color: var(--ink); }
    .brand span { color: var(--accent); }
    nav { display: flex; flex-wrap: wrap; gap: 0.85rem; align-items: center; }
    nav a { text-decoration: none; color: var(--muted); font-size: 0.95rem; }
    nav a:hover { color: var(--ink); }
    main { max-width: 980px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.7rem; margin: 0 0 0.75rem; }
    h2 { font-size: 1.15rem; margin-top: 1.5rem; }
    .muted { color: var(--muted); }
    .flash, .banner, .error {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      border: 1px solid var(--line);
      background: var(--card);
    }
    .flash { border-color: #b7d2c6; background: #eef7f2; }
    .banner.error, .error { border-color: #e0b4b4; background: #fbf0f0; color: var(--bad); }
    table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); }
    th, td { text-align: left; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    .status {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 0.8rem;
      background: #ece7dc;
    }
    .status.BLOCKED, .status.REJECTED { background: #f3d6d6; color: var(--bad); }
    .status.SUBMITTED, .status.APPROVED, .status.ACTIVE, .status.OPEN { background: #d9ebe3; color: var(--ok); }
    .status.PENDING_APPROVAL, .status.PENDING { background: #f7e5c8; color: var(--warn); }
    form.stack label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.92rem; color: var(--muted); }
    form.stack input, form.stack select, form.stack textarea {
      width: 100%;
      max-width: 420px;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      background: #fff;
    }
    button, .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    button.secondary, .btn.secondary {
      background: transparent;
      color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.9rem 1rem;
    }
    .stat strong { display: block; font-size: 1.4rem; }
    .userbox { font-size: 0.85rem; color: var(--muted); }
    .login-wrap { max-width: 400px; margin: 3rem auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.5rem; }
  </style>
</head>
<body>
  {% if user %}
  <header>
    <a class="brand" href="/dashboard">AcmeCorp <span>Procure</span></a>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/vendors">Vendors</a>
      <a href="/pos">POs</a>
      <a href="/invoices">Invoices</a>
      <a href="/invoices/submit">Submit invoice</a>
      <a href="/approvals">Approvals</a>
      <span class="userbox">{{ user.display_name }} ({{ user.role }})</span>
      <form action="/logout" method="post" style="display:inline;margin:0;">
        <button type="submit" class="secondary" style="margin:0;padding:0.25rem 0.6rem;font-size:0.85rem;">Log out</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main>
    {% if flash %}<div class="flash" id="flash">{{ flash }}</div>{% endif %}
    {% if error %}<div class="error" id="error">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
